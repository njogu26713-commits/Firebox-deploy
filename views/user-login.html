<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Firebox — User account</title><link rel="stylesheet" href="/css/style.css" /><script src="/js/theme.js"></script></head>
<body><div class="auth-shell"><div class="auth-card"><div class="auth-brand"><div class="brand-mark">🔥</div><div class="brand-name">Firebox<span>Deploy</span></div></div><div class="eyebrow" id="accountEyebrow">CREATE YOUR ACCOUNT</div><h1 class="auth-title" id="accountTitle">Start building.</h1><p class="auth-sub" id="accountSub">Create a user account for your separate deployment workspace.</p><div class="auth-error" id="userAuthError"></div><form id="registerForm"><div class="field"><label for="registerName">Name</label><input id="registerName" required placeholder="Your name" autofocus /></div><div class="field"><label for="registerEmail">Email</label><input id="registerEmail" type="email" required placeholder="you@example.com" /></div><div class="field"><label for="registerPassword">Password</label><input id="registerPassword" type="password" minlength="8" required placeholder="At least 8 characters" /></div><button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:11px;">Create account <span>→</span></button></form><form id="userLoginForm" style="display:none;"><div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" required placeholder="you@example.com" /></div><div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" required placeholder="Your password" /></div><button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:11px;">Sign in <span>→</span></button></form><p class="text-muted mt-16" style="font-size:12px; text-align:center;"><span id="accountSwitchText">Already have an account?</span> <button class="link-button" id="accountSwitch" type="button">Sign in</button></p><p class="text-muted mt-16" style="font-size:12px;">Admin? <a href="/login" style="color:var(--ember);">Open the admin control panel.</a></p></div></div><script>
const registerForm=document.getElementById('registerForm');const userLoginForm=document.getElementById('userLoginForm');const switchButton=document.getElementById('accountSwitch');const errorBox=document.getElementById('userAuthError');let signInMode=false;
function setMode(next){signInMode=next;registerForm.style.display=next?'none':'block';userLoginForm.style.display=next?'block':'none';document.getElementById('accountEyebrow').textContent=next?'USER ACCOUNT':'CREATE YOUR ACCOUNT';document.getElementById('accountTitle').textContent=next?'Welcome back.':'Start building.';document.getElementById('accountSub').textContent=next?'Sign in to your separate user deployment workspace.':'Create a user account for your separate deployment workspace.';document.getElementById('accountSwitchText').textContent=next?'Need an account?':'Already have an account?';switchButton.textContent=next?'Create account':'Sign in';errorBox.style.display='none';}
switchButton.addEventListener('click',()=>setMode(!signInMode));
async function submitAuth(url,payload,button){errorBox.style.display='none';button.disabled=true;try{const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Account request failed');localStorage.setItem('firebox_user_name',data.user.name);localStorage.setItem('firebox_user_email',data.user.email);window.location.href='/user';}catch(error){errorBox.textContent=error.message;errorBox.style.display='block';button.disabled=false;}}
registerForm.addEventListener('submit',(event)=>{event.preventDefault();submitAuth('/api/user-auth/register',{name:registerName.value,email:registerEmail.value,password:registerPassword.value},event.target.querySelector('button'));});userLoginForm.addEventListener('submit',(event)=>{event.preventDefault();submitAuth('/api/user-auth/login',{email:loginEmail.value,password:loginPassword.value},event.target.querySelector('button'));});
</script></body></html>
