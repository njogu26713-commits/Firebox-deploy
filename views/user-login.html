<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Firebox — User workspace</title><link rel="stylesheet" href="/css/style.css" /><script src="/js/theme.js"></script></head>
<body><div class="auth-shell"><div class="auth-card"><div class="auth-brand"><div class="brand-mark">🔥</div><div class="brand-name">Firebox<span>Deploy</span></div></div><div class="eyebrow">USER WORKSPACE</div><h1 class="auth-title">Start building.</h1><p class="auth-sub">Enter your details to open your separate user workspace.</p><form id="userEntryForm"><div class="field"><label for="userEntryName">Name</label><input id="userEntryName" required placeholder="Your name" autofocus /></div><div class="field"><label for="userEntryEmail">Email</label><input id="userEntryEmail" type="email" required placeholder="you@example.com" /></div><button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:11px;">Open workspace <span>→</span></button></form><p class="text-muted mt-16" style="font-size:12px;">Admin? <a href="/login" style="color:var(--ember);">Sign in to the admin control panel.</a></p></div></div><script>document.getElementById('userEntryForm').addEventListener('submit',(event)=>{event.preventDefault();localStorage.setItem('firebox_user_name',document.getElementById('userEntryName').value.trim());localStorage.setItem('firebox_user_email',document.getElementById('userEntryEmail').value.trim());window.location.href='/app/home';});</script></body></html>
